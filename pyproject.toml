[project]
name = "comfyui-danbooru-pack"
description = """Danbooru tag retrievers and posts downloader"""

version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.urls]
Repository = "https://github.com/alchemine/comfyui-danbooru-pack"
"Bug Tracker" = "https://github.com/alchemine/comfyui-danbooru-pack/issues"

[tool.comfy]
PublisherId = "alchemine"
DisplayName = "ComfyUI-Danbooru-Pack"
Icon = ""


[dependency-groups]
# `requests` is part of ComfyUI itself, so it is only listed here for the tests.
test = ["pytest>=8", "requests"]
